<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Methorics — Онбординг</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="onb">
<div data-topbar></div>

<div class="page" style="max-width:1180px">
  <div class="reveal" style="text-align:center;margin:6px 0 22px">
    <div class="eyebrow">Онбординг · 5 шагов · ≈ 7 минут</div>
    <h1 class="display" style="font-size:30px;margin-top:8px">Очертим границу ваших прав</h1>
  </div>

  <!-- STEPPER -->
  <div class="stepper reveal" id="stepper" style="animation-delay:.05s"></div>

  <div class="grid-2-asym" style="margin-top:26px;align-items:start">
    <!-- STEP CONTENT -->
    <div class="card pad reveal" id="stepCard" style="animation-delay:.1s;min-height:420px"></div>

    <!-- LIVE BOUNDARY -->
    <div class="reveal" style="animation-delay:.16s;display:flex;flex-direction:column;gap:16px">
      <div class="card pad">
        <div class="card-h"><span class="ic" id="m-ic"></span><h3>Прочность картины</h3></div>
        <div class="meter">
          <div class="meter-top"><span class="lab">граница идентичности</span><span class="val" id="mVal">0%</span></div>
          <div class="meter-track"><div class="meter-fill" id="mFill"></div></div>
          <div class="meter-ticks"><span>фрагментарно</span><span>достаточно для симуляций</span></div>
        </div>
        <hr class="sep">
        <div class="small muted" style="margin-bottom:9px">Что уже знает система:</div>
        <div id="known" style="display:flex;flex-direction:column;gap:7px"></div>
      </div>
      <div class="card pad" style="background:var(--steel-tint);border-color:#CFE0EF">
        <div style="display:flex;gap:10px;align-items:flex-start">
          <span style="color:var(--steel)">${''}</span>
          <div id="hint" class="small" style="color:var(--navy)"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="methorics.js"></script>
<script>
MET.init_onb = function(){
  MET.buildTopbar({crumb:'Онбординг', back:'index.html?profile='+MET.profile()});
  document.getElementById('m-ic').innerHTML = MET.ic('shield');

  const steps=[
    {t:'Субъект',hint:'Тип субъекта задаёт релевантные угрозы и набор сценариев.'},
    {t:'Домен',hint:'Домен деятельности фильтрует каталог шоковых сценариев под вас.'},
    {t:'Активы',hint:'Заявленные активы становятся узлами графа прав. Подтверждение — на след. шаге.'},
    {t:'Документы',hint:'Загруженные файлы привязываются к узлам и переводят их из «заявлено» в «подтверждено».'},
    {t:'Уточнение',hint:'Точечные вопросы закрывают пробелы границы — там, где она тоньше всего.'}
  ];
  const pct=[20,38,56,74,86];
  let cur=0; const known=[];

  function drawStepper(){
    document.getElementById('stepper').innerHTML = steps.map((s,i)=>{
      const cls=i<cur?'done':(i===cur?'active':'');
      const bar=i<steps.length-1?`<span class="bar"></span>`:'';
      return `<div class="step ${cls}"><span class="num">${i<cur?'✓':(i+1)}</span><span class="lab">${s.t}</span></div>${bar}`;
    }).join('');
  }
  function setMeter(){const v=cur>0?pct[cur-1]:0;
    document.getElementById('mVal').textContent=v+'%';
    MET.fillMeter(document.getElementById('mFill'),v);}
  function addKnown(txt){known.push(txt);
    document.getElementById('known').innerHTML=known.map(k=>`<div style="display:flex;gap:8px;align-items:center" class="small"><span style="color:var(--ok)">${MET.ic('check')}</span>${k}</div>`).join('');}
  function setHint(){document.getElementById('hint').innerHTML='<b>Подсказка.</b> '+steps[cur].hint;}

  function nav(next,label){
    return `<div style="display:flex;justify-content:space-between;margin-top:22px">
      <button class="btn btn-ghost ${cur===0?'':''}" id="prevBtn" ${cur===0?'disabled':''}>Назад</button>
      <button class="btn btn-primary" id="nextBtn">${label||'Далее'} ${next?MET.ic('arrow'):''}</button></div>`;
  }

  function render(){
    drawStepper(); setMeter(); setHint();
    const c=document.getElementById('stepCard');
    if(cur===0){
      c.innerHTML=`<div class="eyebrow">Шаг 1</div><h2 style="font-size:20px;margin:8px 0 4px">Кто правообладатель?</h2>
        <p class="muted small" style="margin-bottom:16px">Выберите тип субъекта — от него зависит роль в Среде и релевантные сценарии.</p>
        <div class="opt-grid" id="subj">
          ${optRow('author','user','Индивидуальный автор','Создаю произведения от своего имени',true)}
          ${optRow('org','building','Организация / компания','Активы распределены между авторами')}
          ${optRow('unit','net','Структурное подразделение','R&D / бренд-команда внутри организации')}
          ${optRow('agency','users','Патентное бюро / агент','Веду стресс-тесты для клиентов')}
        </div>${nav(true)}`;
      bindOpts('subj');
    }
    if(cur===1){
      c.innerHTML=`<div class="eyebrow">Шаг 2</div><h2 style="font-size:20px;margin:8px 0 4px">Домен деятельности</h2>
        <p class="muted small" style="margin-bottom:16px">Отметьте всё, что относится к вам (можно несколько).</p>
        <div class="chip-row" id="doms">
          ${['Литература / тексты','Дизайн / визуал','ПО / алгоритмы','Бренд / нейминг','Изобретения','Медиа / контент','База данных','Контент для ИИ'].map((d,i)=>`<span class="chip ${i<2?'active':''}">${d}</span>`).join('')}
        </div>
        <hr class="sep">
        <div class="small muted" style="margin-bottom:8px">Роль на рынке</div>
        <div class="chip-row" id="roles">
          ${['Автор-создатель','Лицензиар','Подрядчик','Держатель портфеля'].map((d,i)=>`<span class="chip ${i===0?'active':''}">${d}</span>`).join('')}
        </div>${nav(true)}`;
      [...c.querySelectorAll('.chip')].forEach(ch=>ch.addEventListener('click',()=>ch.classList.toggle('active')));
    }
    if(cur===2){
      c.innerHTML=`<div class="eyebrow">Шаг 3</div><h2 style="font-size:20px;margin:8px 0 4px">Декларация активов</h2>
        <p class="muted small" style="margin-bottom:16px">Назовите объекты ИС. Они станут узлами карты прав.</p>
        <div id="assetList" style="display:flex;flex-direction:column;gap:9px"></div>
        <div class="composer" style="border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:14px;padding:10px">
          <div class="box" style="border:0;padding:0">
            <input id="aName" placeholder="Например: роман «Северный путь»">
            <select id="aType" style="border:0;background:var(--paper-2);border-radius:9px;padding:8px 10px;font-family:var(--font-ui);color:var(--navy)">
              <option>© Произведение</option><option>Бренд / ТЗ</option><option>Изобретение</option><option>Ноу-хау</option><option>Домен</option></select>
            <button class="send" id="addAsset">+</button>
          </div></div>${nav(true)}`;
      const list=c.querySelector('#assetList'); const seed=[['Роман «Северный путь»','© Произведение'],['Логотип бренда','© Произведение'],['Название бренда','Бренд / ТЗ']];
      const items=[...seed];
      function draw(){list.innerHTML=items.map((a,i)=>`<div class="doc-row ok"><span class="fi">ИС</span><div style="flex:1"><b>${a[0]}</b><div class="tiny faint">${a[1]} · заявлено</div></div><span class="chip" data-rm="${i}" style="padding:4px 10px">✕</span></div>`).join('');
        list.querySelectorAll('[data-rm]').forEach(b=>b.addEventListener('click',()=>{items.splice(+b.dataset.rm,1);draw();}));}
      draw();
      c.querySelector('#addAsset').addEventListener('click',()=>{const n=c.querySelector('#aName');if(n.value.trim()){items.push([n.value.trim(),c.querySelector('#aType').value]);n.value='';draw();}});
    }
    if(cur===3){
      c.innerHTML=`<div class="eyebrow">Шаг 4</div><h2 style="font-size:20px;margin:8px 0 4px">Документы и сведения</h2>
        <p class="muted small" style="margin-bottom:16px">Перетащите договоры, свидетельства, депозиты. Система извлечёт факты — данные не покидают ваш контур.</p>
        <div class="dropzone" id="drop"><div class="big">${MET.ic('download')}</div>
          <b>Перетащите файлы сюда</b><div class="small faint" style="margin-top:4px">PDF, DOCX, изображения · обработка локально</div></div>
        <div id="docs" style="margin-top:12px"></div>
        <div class="small" id="extracted" style="margin-top:12px"></div>${nav(true)}`;
      const docs=c.querySelector('#drop');
      const seed=[['Договор_дизайнер.pdf',true],['Свидетельство_депонир.pdf',true],['Скриншот_публикации.png',false]];
      function feed(){const box=c.querySelector('#docs');box.innerHTML=seed.map((d,i)=>`<div class="doc-row ${d[1]?'ok':''}"><span class="fi">${d[0].split('.').pop().toUpperCase()}</span>
        <div style="flex:1"><b>${d[0]}</b><div class="doc-prog"><i id="pg${i}"></i></div></div>
        <span class="badge ${d[1]?'ok':'warn'}" id="bd${i}">обработка…</span></div>`).join('');
        seed.forEach((d,i)=>setTimeout(()=>{c.querySelector('#pg'+i).style.width='100%';
          setTimeout(()=>{c.querySelector('#bd'+i).className='badge '+(d[1]?'ok':'warn');c.querySelector('#bd'+i).textContent=d[1]?'факты извлечены':'низкое качество';},700);},300+i*350));
        setTimeout(()=>{c.querySelector('#extracted').innerHTML='<span class="badge steel">'+MET.ic('check')+' Извлечено 14 фактов · привязано к 4 узлам · 2 узла подтверждены</span>';},2200);}
      docs.addEventListener('click',feed); feed();
    }
    if(cur===4){
      c.innerHTML=`<div class="eyebrow">Шаг 5</div><h2 style="font-size:20px;margin:8px 0 4px">Уточнение пробелов</h2>
        <p class="muted small" style="margin-bottom:16px">Система спрашивает там, где граница тоньше всего.</p>
        <div class="dialog-stream" style="padding:0;gap:12px">
          <div class="msg assistant"><div class="who">Methorics</div><div class="bubble">Зафиксирована ли дата создания романа «Северный путь» (депонирование, таймстемп)?</div></div>
          <div class="qr composer" style="border:0;padding:0;background:none"><span class="chip">Да, есть депозит</span><span class="chip active">Нет</span><span class="chip">Не уверен</span></div>
          <div class="msg assistant"><div class="who">Methorics</div><div class="bubble">Оформлен ли режим коммерческой тайны и NDA для ноу-хау?</div></div>
          <div class="qr composer" style="border:0;padding:0;background:none"><span class="chip">Да</span><span class="chip active">Нет</span><span class="chip">Частично</span></div>
          <div class="sys-note">Ответы помечают узлы «приоритет» и «ноу-хау» как уязвимые — это учтётся в симуляциях.</div>
        </div>${nav(false,'Завершить и открыть консоль')}`;
      [...c.querySelectorAll('.qr')].forEach(qr=>qr.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{qr.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));ch.classList.add('active');})));
    }
    document.getElementById('prevBtn')?.addEventListener('click',()=>{if(cur>0){cur--;render();}});
    document.getElementById('nextBtn').addEventListener('click',()=>{
      // record "known"
      if(cur===0)addKnown('Тип субъекта: автор');
      if(cur===1)addKnown('Домен: литература, дизайн');
      if(cur===2)addKnown('Заявлено 3 актива');
      if(cur===3)addKnown('Подтверждено документами: 2 узла');
      if(cur===4)addKnown('Помечены уязвимости: приоритет, ноу-хау');
      if(cur<steps.length-1){cur++;render();}
      else location.href='workspace.html?profile='+MET.profile();
    });
  }
  function optRow(id,ic,t,s,sel){return `<div class="opt ${sel?'sel':''}" data-k="${id}"><span class="ic">${MET.ic(ic)}</span><div><div class="t">${t}</div><div class="s">${s}</div></div><span class="pick"></span></div>`;}
  function bindOpts(wrapId){const w=document.getElementById(wrapId);w.querySelectorAll('.opt').forEach(o=>o.addEventListener('click',()=>{w.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');}));}
  render();
};
</script>
</body>
</html>
