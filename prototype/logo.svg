<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Methorics">
  <defs>
    <linearGradient id="mNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A4E7E"/>
      <stop offset="1" stop-color="#1F3A5F"/>
    </linearGradient>
    <linearGradient id="mGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7A04A"/>
      <stop offset="1" stop-color="#A8812A"/>
    </linearGradient>
  </defs>
  <!-- edges: B-L up, L-center down, center-R up, R-B down -->
  <g stroke="#2E6DA4" stroke-width="3.4" stroke-linecap="round" fill="none">
    <line x1="18" y1="80" x2="18" y2="24"/>
    <line x1="18" y1="24" x2="50" y2="58"/>
    <line x1="50" y1="58" x2="82" y2="24"/>
    <line x1="82" y1="24" x2="82" y2="80"/>
  </g>
  <!-- mid waypoint nodes -->
  <g fill="#5B8FBF">
    <circle cx="18" cy="52" r="3.2"/>
    <circle cx="34" cy="41" r="3.2"/>
    <circle cx="66" cy="41" r="3.2"/>
    <circle cx="82" cy="52" r="3.2"/>
  </g>
  <!-- main nodes -->
  <g>
    <circle cx="18" cy="80" r="7.2" fill="url(#mNode)"/>
    <circle cx="18" cy="24" r="7.2" fill="url(#mNode)"/>
    <circle cx="82" cy="24" r="7.2" fill="url(#mNode)"/>
    <circle cx="82" cy="80" r="7.2" fill="url(#mNode)"/>
    <circle cx="50" cy="58" r="8.4" fill="url(#mGold)"/>
    <circle cx="50" cy="58" r="3.2" fill="#FBF3DC"/>
  </g>
</svg>
