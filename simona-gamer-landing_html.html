<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simona Gamer — платки, резинки, ленты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=Space+Mono:wght@400;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@400;500;600&display=swap" rel="stylesheet">
<style>

/* ============ TOKENS ============ */
:root{
  --paper: #F1EADC;
  --paper-deep: #E8DFCC;
  --ink: #26211B;
  --ink-soft: #56503F;
  --line: rgba(38,33,27,.18);
  --line-strong: rgba(38,33,27,.32);

  --hoopoe: #AE5A2E;
  --kingfisher: #1E5C61;
  --sunbird: #A9821F;
  --ibex: #6E6353;
  --gazelle: #8C5A3C;

  --accent: var(--hoopoe);

  --font-display: 'Fraunces', Georgia, serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'Space Mono', monospace;

  --max: 1180px;
  --radius: 2px;
}

html[lang="he"]{
  --font-display: 'Frank Ruhl Libre', 'Fraunces', serif;
  --font-body: 'Heebo', sans-serif;
  --font-mono: 'Heebo', sans-serif;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img,svg{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

h1,h2,h3,h4{font-family:var(--font-display);font-weight:500;margin:0;line-height:1.08;letter-spacing:-.01em;}
p{margin:0;line-height:1.65;}

.wrap{max-width:var(--max);margin-inline:auto;padding-inline:24px;}
@media(min-width:640px){.wrap{padding-inline:40px;}}

.eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
  display:flex;
  align-items:center;
  gap:10px;
}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--accent);}
html[lang="he"] .eyebrow{letter-spacing:0;}

.hairline{border:none;border-top:1px solid var(--line);margin:0;}

.btn{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  padding:14px 22px;border:1px solid var(--ink);background:transparent;color:var(--ink);
  transition:background .25s ease, color .25s ease;
  white-space:nowrap;
}
html[lang="he"] .btn{letter-spacing:0;}
.btn:hover{background:var(--ink);color:var(--paper);}
.btn.solid{background:var(--ink);color:var(--paper);}
.btn.solid:hover{background:var(--accent);border-color:var(--accent);color:var(--paper);}
.btn.small{padding:10px 16px;font-size:11px;}

/* reveal on scroll */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease, transform .7s ease;}
.reveal.in{opacity:1;transform:none;}
@media(prefers-reduced-motion:reduce){
  .reveal{opacity:1;transform:none;transition:none;}
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important;}
}

/* ============ HEADER ============ */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(241,234,220,.92);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
}
.headbar{
  display:flex;align-items:center;justify-content:space-between;
  padding-block:16px;
}
.logo{
  font-family:var(--font-display);font-size:20px;letter-spacing:.01em;
  display:flex;flex-direction:column;line-height:1;
}
.logo b{font-weight:600;font-size:21px;}
.logo span{font-family:var(--font-mono);font-size:9px;letter-spacing:.18em;color:var(--ink-soft);margin-top:5px;text-transform:uppercase;}
html[lang="he"] .logo span{letter-spacing:.02em;}

nav.desknav{display:none;gap:28px;font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;}
html[lang="he"] nav.desknav{letter-spacing:0;}
nav.desknav a{position:relative;padding-bottom:3px;}
nav.desknav a::after{content:"";position:absolute;inset-inline-start:0;bottom:0;width:0;height:1px;background:var(--ink);transition:width .25s ease;}
nav.desknav a:hover::after{width:100%;}
@media(min-width:900px){nav.desknav{display:flex;}}

.head-right{display:flex;align-items:center;gap:14px;}
.langsw{display:flex;border:1px solid var(--line-strong);font-family:var(--font-mono);font-size:11px;}
.langsw button{background:none;border:none;padding:7px 10px;color:var(--ink-soft);}
.langsw button.active{background:var(--ink);color:var(--paper);}
.langsw button:not(:last-child){border-inline-end:1px solid var(--line-strong);}

.burger{display:flex;flex-direction:column;gap:4px;background:none;border:none;padding:6px;}
.burger span{width:22px;height:1.5px;background:var(--ink);display:block;}
@media(min-width:900px){.burger{display:none;}}

.mobnav{
  display:flex;flex-direction:column;gap:0;
  max-height:0;overflow:hidden;
  border-top:0 solid var(--line);
  transition:max-height .35s ease;
}
.mobnav.open{max-height:400px;border-top:1px solid var(--line);}
.mobnav a{padding:14px 0;border-bottom:1px solid var(--line);font-family:var(--font-mono);font-size:13px;letter-spacing:.05em;text-transform:uppercase;}
@media(min-width:900px){.mobnav{display:none !important;}}

/* ============ HERO ============ */
.hero{padding-block:56px 40px;}
@media(min-width:900px){.hero{padding-block:88px 60px;}}
.hero-grid{display:grid;gap:40px;}
@media(min-width:900px){.hero-grid{grid-template-columns:1.05fr .95fr;align-items:center;gap:60px;}}

.hero-title{font-size:clamp(32px,6vw,54px);margin-block:18px 20px;}
.hero-sub{font-size:16px;color:var(--ink-soft);max-width:44ch;margin-bottom:30px;}
.hero-cta{display:flex;flex-wrap:wrap;gap:14px;}

/* specimen plate */
.plate-frame{
  position:relative;
  border:1px solid var(--ink);
  padding:10px;
  background:var(--paper-deep);
}
.plate-frame::before{
  content:"";position:absolute;inset:5px;border:1px solid var(--line-strong);pointer-events:none;
}
.plate-inner{
  position:relative;aspect-ratio:1/1;overflow:hidden;
  background:var(--swatch-bg,var(--paper));
  clip-path:polygon(0 0,100% 0,100% 96%,97% 100%,0 100%);
  transition:background .5s ease;
}
.plate-dots{
  position:absolute;inset:0;
  background-image:radial-gradient(currentColor 1px,transparent 1px);
  background-size:16px 16px;
  color:var(--swatch-fg,var(--ink));
  opacity:.12;
}
.plate-icon{
  position:absolute;inset:10%;
  color:var(--swatch-fg,var(--ink));
  opacity:0;transition:opacity .5s ease;
}
.plate-icon.show{opacity:1;}
.plate-label{
  position:absolute;inset-inline-start:14px;bottom:14px;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;
  color:var(--swatch-fg,var(--ink));
  display:flex;flex-direction:column;gap:2px;
}
.plate-label b{font-family:var(--font-display);font-style:italic;font-size:16px;font-weight:500;}
.plate-num{
  position:absolute;top:14px;inset-inline-end:14px;
  font-family:var(--font-mono);font-size:11px;color:var(--swatch-fg,var(--ink));
}
.plate-tabs{display:flex;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap;}
.plate-tabs button{
  width:30px;height:30px;border:1px solid var(--line-strong);background:none;
  font-family:var(--font-mono);font-size:10px;color:var(--ink-soft);
}
.plate-tabs button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

/* ============ TICKER ============ */
.ticker-wrap{border-block:1px solid var(--ink);background:var(--ink);color:var(--paper);overflow:hidden;padding-block:12px;}
.ticker{display:flex;gap:40px;white-space:nowrap;width:max-content;animation:scroll 26s linear infinite;font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;}
html[dir="rtl"] .ticker{animation-direction:reverse;}
.ticker span{opacity:.85;}
.ticker span::after{content:"•";margin-inline-start:40px;color:var(--sunbird);}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ============ SECTION HEADS ============ */
.sec{padding-block:64px;}
@media(min-width:900px){.sec{padding-block:96px;}}
.sec-head{max-width:640px;margin-bottom:44px;}
.sec-head h2{font-size:clamp(26px,4vw,38px);margin-block:14px 12px;}
.sec-head p{color:var(--ink-soft);font-size:15px;}

/* ============ COLLECTIONS ============ */
.coll-grid{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line-strong);border:1px solid var(--line-strong);}
@media(min-width:640px){.coll-grid{grid-template-columns:1fr 1fr;}}
@media(min-width:1000px){.coll-grid{grid-template-columns:repeat(3,1fr);}}
.coll-card{background:var(--paper);padding:26px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:background .3s ease;}
.coll-card:hover{background:var(--paper-deep);}
.coll-top{display:flex;justify-content:space-between;align-items:flex-start;font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);}
.coll-swatch{
  aspect-ratio:4/3;position:relative;overflow:hidden;
  background:var(--sw-bg);
}
.coll-swatch .plate-dots{color:var(--sw-fg);}
.coll-swatch svg{position:absolute;inset:14%;color:var(--sw-fg);}
.coll-name{font-size:22px;}
.coll-name em{display:block;font-family:var(--font-mono);font-style:normal;font-size:11px;letter-spacing:.06em;color:var(--sw-bg-solid,var(--accent));text-transform:none;margin-top:4px;}
.coll-desc{font-size:14px;color:var(--ink-soft);flex:1;}
.coll-link{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;}
.coll-link svg{width:12px;height:12px;}

/* named swatch color helpers */
.sw-hoopoe{--sw-bg:#EFDDCB;--sw-fg:#AE5A2E;--sw-bg-solid:#AE5A2E;}
.sw-kingfisher{--sw-bg:#D9E3E0;--sw-fg:#1E5C61;--sw-bg-solid:#1E5C61;}
.sw-sunbird{--sw-bg:#EDE3C4;--sw-fg:#A9821F;--sw-bg-solid:#A9821F;}
.sw-ibex{--sw-bg:#E4DECE;--sw-fg:#6E6353;--sw-bg-solid:#6E6353;}
.sw-gazelle{--sw-bg:#E7D6C7;--sw-fg:#8C5A3C;--sw-bg-solid:#8C5A3C;}

/* ============ PRODUCT STRIP ============ */
.ptypes{display:grid;grid-template-columns:1fr;gap:1px;background:var(--line-strong);border:1px solid var(--line-strong);}
@media(min-width:700px){.ptypes{grid-template-columns:repeat(3,1fr);}}
.ptype{background:var(--paper);padding:30px 26px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
.ptype svg{width:38px;height:38px;color:var(--accent);}
.ptype h4{font-size:18px;}
.ptype p{font-size:13px;color:var(--ink-soft);}

/* ============ GALLERY ============ */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px;}
.chip{
  font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  padding:8px 14px;border:1px solid var(--line-strong);background:none;color:var(--ink-soft);
}
.chip.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.gal-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(min-width:640px){.gal-grid{grid-template-columns:repeat(3,1fr);gap:18px;}}
@media(min-width:1000px){.gal-grid{grid-template-columns:repeat(4,1fr);}}
.gal-item{
  position:relative;aspect-ratio:1/1;background:var(--sw-bg);overflow:hidden;cursor:pointer;
  border:1px solid var(--line);
}
.gal-item .plate-dots{color:var(--sw-fg);opacity:.14;}
.gal-cap{
  position:absolute;inset-inline-start:0;bottom:0;width:100%;
  padding:8px 10px;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;
  background:linear-gradient(to top,rgba(38,33,27,.55),transparent);color:#fff;
  display:flex;justify-content:space-between;
}
.mockup-scarf{position:absolute;inset:16%;transform:rotate(-6deg);box-shadow:0 10px 24px rgba(38,33,27,.18);}
.mockup-scarf .fold{position:absolute;inset-inline-end:0;top:0;width:34%;height:34%;background:rgba(0,0,0,.14);clip-path:polygon(0 0,100% 0,100% 100%);}
.mockup-ring{position:absolute;inset:22%;border-radius:50%;border-width:16px;border-style:solid;box-shadow:0 8px 18px rgba(38,33,27,.16);}
.mockup-ring::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:1px solid rgba(38,33,27,.15);}
.mockup-ribbon{position:absolute;inset-inline-start:8%;top:44%;width:84%;height:20%;border-radius:40px;transform:rotate(-4deg);box-shadow:0 8px 16px rgba(38,33,27,.16);}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(38,33,27,.86);z-index:100;display:none;align-items:center;justify-content:center;padding:24px;}
.lightbox.open{display:flex;}
.lb-box{background:var(--paper);max-width:420px;width:100%;padding:16px;border:1px solid var(--ink);position:relative;}
.lb-swatch{aspect-ratio:1/1;position:relative;overflow:hidden;background:var(--sw-bg);}
.lb-close{position:absolute;top:10px;inset-inline-end:10px;background:var(--ink);color:var(--paper);width:30px;height:30px;border:none;font-size:16px;z-index:5;}
.lb-cap{padding-top:14px;}
.lb-cap b{font-family:var(--font-display);font-size:18px;font-style:italic;font-weight:500;}
.lb-cap span{display:block;font-family:var(--font-mono);font-size:11px;color:var(--ink-soft);margin-top:4px;}

/* ============ ABOUT ============ */
.about-grid{display:grid;gap:40px;}
@media(min-width:900px){.about-grid{grid-template-columns:.8fr 1.2fr;gap:64px;align-items:start;}}
.portrait{
  aspect-ratio:3/4;background:var(--paper-deep);border:1px solid var(--line-strong);position:relative;overflow:hidden;
}
.portrait svg{position:absolute;inset:0;width:100%;height:100%;}
.about-name{font-size:clamp(26px,4vw,36px);margin-block:14px 6px;}
.about-role{font-family:var(--font-mono);font-size:12px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:20px;}
html[lang="he"] .about-role{letter-spacing:0;}
.about-bio{font-size:15px;color:var(--ink-soft);max-width:62ch;margin-bottom:26px;}
.facts{display:grid;gap:0;border-top:1px solid var(--line);}
.facts li{list-style:none;display:flex;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:baseline;}
.facts li::before{content:"—";color:var(--accent);font-family:var(--font-mono);flex:none;}

/* ============ ORDER ============ */
.order-box{
  display:grid;gap:40px;
}
@media(min-width:900px){.order-box{grid-template-columns:.9fr 1.1fr;}}
.order-side p{color:var(--ink-soft);font-size:15px;margin-bottom:20px;}
.order-side .facts{margin-top:20px;}
form{display:grid;gap:18px;}
.field{display:flex;flex-direction:column;gap:8px;}
.field label{font-family:var(--font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
html[lang="he"] .field label{letter-spacing:0;}
.field input,.field select,.field textarea{
  border:none;border-bottom:1px solid var(--line-strong);background:transparent;
  padding:10px 2px;font-size:15px;color:var(--ink);outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.row2{display:grid;gap:18px;}
@media(min-width:560px){.row2{grid-template-columns:1fr 1fr;}}
.radiorow{display:flex;gap:18px;flex-wrap:wrap;}
.radiopill{display:flex;align-items:center;gap:8px;font-size:14px;}
.toast{
  margin-top:16px;padding:14px 16px;border:1px solid var(--accent);background:rgba(174,90,46,.08);
  font-size:13px;display:none;
}
.toast.show{display:block;}

/* ============ CONTACT / FOOTER ============ */
footer{background:var(--ink);color:var(--paper);padding-block:56px 26px;margin-top:40px;}
.foot-grid{display:grid;gap:36px;}
@media(min-width:800px){.foot-grid{grid-template-columns:1.2fr 1fr 1fr;}}
footer h4{font-family:var(--font-display);font-style:italic;font-size:22px;font-weight:500;margin-bottom:14px;}
footer .foot-lead{color:rgba(241,234,220,.7);font-size:14px;max-width:32ch;}
.foot-list{display:flex;flex-direction:column;gap:10px;font-size:14px;}
.foot-list a:hover{color:var(--sunbird);}
.foot-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(241,234,220,.5);margin-bottom:6px;}
.foot-bottom{border-top:1px solid rgba(241,234,220,.18);margin-top:44px;padding-top:20px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-family:var(--font-mono);font-size:11px;color:rgba(241,234,220,.55);}
.foot-note{max-width:60ch;}

::selection{background:var(--accent);color:var(--paper);}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header>
  <div class="wrap headbar">
    <div class="logo"><b>Simona Gamer</b><span data-i18n="tagline_small"></span></div>
    <nav class="desknav">
      <a href="#hero" data-i18n="nav_home"></a>
      <a href="#collections" data-i18n="nav_coll"></a>
      <a href="#gallery" data-i18n="nav_gal"></a>
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#order" data-i18n="nav_order"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
    <div class="head-right">
      <div class="langsw" id="langsw">
        <button data-lang="ru">RU</button>
        <button data-lang="en">EN</button>
        <button data-lang="he">עב</button>
      </div>
      <button class="burger" id="burgerBtn" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </div>
  <div class="wrap">
    <div class="mobnav" id="mobnav">
      <a href="#hero" data-i18n="nav_home"></a>
      <a href="#collections" data-i18n="nav_coll"></a>
      <a href="#gallery" data-i18n="nav_gal"></a>
      <a href="#about" data-i18n="nav_about"></a>
      <a href="#order" data-i18n="nav_order"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </div>
  </div>
</header>

<!-- ============ HERO ============ -->
<section class="hero" id="hero">
  <div class="wrap hero-grid">
    <div>
      <div class="eyebrow" data-i18n="hero_eyebrow"></div>
      <h1 class="hero-title" data-i18n="hero_title"></h1>
      <p class="hero-sub" data-i18n="hero_sub"></p>
      <div class="hero-cta">
        <a href="#collections" class="btn solid" data-i18n="hero_cta1"></a>
        <a href="#order" class="btn" data-i18n="hero_cta2"></a>
      </div>
    </div>
    <div>
      <div class="plate-frame">
        <div class="plate-inner" id="plateInner">
          <div class="plate-dots"></div>
          <div class="plate-num" id="plateNum">No. 01</div>
          <div class="plate-icon show" id="plateIcon"></div>
          <div class="plate-label">
            <b id="plateName">Hoopoe</b>
            <span id="plateLatin">Upupa epops</span>
          </div>
        </div>
      </div>
      <div class="plate-tabs" id="plateTabs"></div>
    </div>
  </div>
</section>

<!-- ============ TICKER ============ -->
<div class="ticker-wrap">
  <div class="ticker" id="tickerEl"></div>
</div>

<!-- ============ COLLECTIONS ============ -->
<section class="sec" id="collections">
  <div class="wrap">
    <div class="sec-head reveal">
      <div class="eyebrow" data-i18n="coll_eyebrow"></div>
      <h2 data-i18n="coll_title"></h2>
      <p data-i18n="coll_sub"></p>
    </div>
    <div class="coll-grid reveal" id="collGrid"></div>
  </div>
</section>

<!-- ============ PRODUCT TYPES ============ -->
<section class="sec" style="padding-top:0" id="products">
  <div class="wrap">
    <div class="sec-head reveal">
      <div class="eyebrow" data-i18n="prod_eyebrow"></div>
      <h2 data-i18n="prod_title"></h2>
    </div>
    <div class="ptypes reveal">
      <div class="ptype">
        <svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 10 Q20 26 36 10"/><path d="M4 10 Q20 -2 36 10"/><path d="M8 12 L4 24 M32 12 L36 24"/></svg>
        <h4 data-i18n="prod_scarf_n"></h4>
        <p data-i18n="prod_scarf_d"></p>
      </div>
      <div class="ptype">

let LANG = "ru";

function applyLang(lang){
  LANG = lang;
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "he" ? "rtl" : "ltr";
  document.body.classList.toggle("lang-he", lang==="he");

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const key = el.getAttribute("data-i18n");
    if(T[key]) el.textContent = T[key][lang];
  });
  document.querySelectorAll("#langsw button").forEach(b=>{
    b.classList.toggle("active", b.dataset.lang===lang);
  });

  buildTicker();
  buildCollections();
  buildGallery(currentFilter);
  buildAboutFacts();
  updatePlate();
}

function buildTicker(){
  const words = LANG==="ru" ? ["Платки","Резинки","Ленты"] : LANG==="en" ? ["Scarves","Scrunchies","Ribbons"] : ["צעיפים","גומיות","סרטים"];
  const seq = [...words,...words,...words,...words];
  document.getElementById("tickerEl").innerHTML = seq.map(w=>`<span>${w}</span>`).join("");
}

  const grid = document.getElementById("collGrid");
  grid.innerHTML = COLLECTIONS.map(c=>`
    <div class="coll-card" data-key="${c.key}">
      <div class="coll-top"><span>No. ${c.num}</span><span>${c.latin}</span></div>
      <div class="coll-swatch ${c.sw}"><div class="plate-dots"></div>${ICONS[c.key]}</div>
      <h3 class="coll-name">${T["coll_name_"+c.key][LANG]}<em>${c.latin}</em></h3>
      <p class="coll-desc">${T["coll_desc_"+c.key][LANG]}</p>
      <div class="coll-link">${T.coll_view[LANG]}
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </div>
    </div>
  `).join("");
  grid.querySelectorAll(".coll-card").forEach(card=>{
    card.addEventListener("click", ()=>{
      currentFilter = card.dataset.key;
      buildGallery(currentFilter);
      document.getElementById("gallery").scrollIntoView({behavior:"smooth"});
    });
  });

  // populate order form select
  const sel = document.getElementById("collSelect");
  sel.innerHTML = COLLECTIONS.map(c=>`<option value="${c.key}">${T["coll_name_"+c.key][LANG]}</option>`).join("");
}

function buildAboutFacts(){
  const list = document.getElementById("aboutFacts");
  list.innerHTML = ["about_f1","about_f2","about_f3","about_f4"].map(k=>`<li>${T[k][LANG]}</li>`).join("");
}

/* gallery */
const PRODUCTS = ["scarf","tie","ribbon"];
let currentFilter = "all";

function buildChips(){
  const chips = document.getElementById("chips");
  const all = [{key:"all",label:T.chip_all}, ...COLLECTIONS.map(c=>({key:c.key,label:T["coll_name_"+c.key]}))];
  chips.innerHTML = all.map(c=>`<button class="chip ${c.key===currentFilter?'active':''}" data-key="${c.key}">${c.label[LANG]}</button>`).join("");
  chips.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("click", ()=>{
      currentFilter = ch.dataset.key;
      buildGallery(currentFilter);
    });
  });
}

function mockupHTML(product, accentVar){
  if(product==="scarf") return `<div class="mockup-scarf" style="background:${accentVar}"><div class="fold"></div></div>`;
  if(product==="tie") return `<div class="mockup-ring" style="border-color:${accentVar}"></div>`;
  return `<div class="mockup-ribbon" style="background:${accentVar}"></div>`;
}

function buildGallery(filter){
  buildChips();
  const grid = document.getElementById("galGrid");
  let items = [];
  COLLECTIONS.forEach(c=>{
    PRODUCTS.forEach(p=>{
      items.push({coll:c, product:p});
    });
  });
  if(filter && filter!=="all") items = items.filter(i=>i.coll.key===filter);

  grid.innerHTML = items.map(i=>`
    <div class="gal-item ${i.coll.sw}" data-coll="${i.coll.key}" data-product="${i.product}">
      <div class="plate-dots"></div>
      ${mockupHTML(i.product, i.coll.accent)}
      <div class="gal-cap"><span>${T["coll_name_"+i.coll.key][LANG]}</span><span>${T["prod_"+(i.product==="tie"?"tie":i.product)+"_n"][LANG]}</span></div>
    </div>
  `).join("");

  grid.querySelectorAll(".gal-item").forEach(el=>{
    el.addEventListener("click", ()=>openLightbox(el.dataset.coll, el.dataset.product));
  });
}

function openLightbox(collKey, product){
  const c = COLLECTIONS.find(x=>x.key===collKey);
  const lb = document.getElementById("lightbox");
  const sw = document.getElementById("lbSwatch");
  sw.className = "lb-swatch " + c.sw;
  sw.innerHTML = `<div class="plate-dots"></div>${mockupHTML(product, c.accent)}`;
  document.getElementById("lbTitle").textContent = T["coll_name_"+collKey][LANG] + " — " + T["prod_"+(product==="tie"?"tie":product)+"_n"][LANG];
  document.getElementById("lbSub").textContent = c.latin + "  ·  No. " + c.num;
  lb.classList.add("open");
}
document.getElementById("lbClose").addEventListener("click", ()=>document.getElementById("lightbox").classList.remove("open"));
document.getElementById("lightbox").addEventListener("click", (e)=>{ if(e.target.id==="lightbox") e.currentTarget.classList.remove("open"); });

/* hero plate */
let plateIdx = 0;
let plateTimer = null;

function buildPlateTabs(){
  const tabs = document.getElementById("plateTabs");
  tabs.innerHTML = COLLECTIONS.map((c,i)=>`<button data-i="${i}" class="${i===plateIdx?'active':''}">${c.num}</button>`).join("");
  tabs.querySelectorAll("button").forEach(b=>{
    b.addEventListener("click", ()=>{ plateIdx = parseInt(b.dataset.i); updatePlate(); resetPlateTimer(); });
  });
}

function updatePlate(){
  const c = COLLECTIONS[plateIdx];
  const inner = document.getElementById("plateInner");
  const swColors = {
    hoopoe:["#EFDDCB","#AE5A2E"], kingfisher:["#D9E3E0","#1E5C61"], sunbird:["#EDE3C4","#A9821F"],
    ibex:["#E4DECE","#6E6353"], gazelle:["#E7D6C7","#8C5A3C"]
  };
  const [bg,fg] = swColors[c.key];
  inner.style.setProperty("--swatch-bg", bg);
  inner.style.setProperty("--swatch-fg", fg);
  document.getElementById("plateNum").textContent = "No. " + c.num;
  document.getElementById("plateIcon").innerHTML = ICONS[c.key];
  document.getElementById("plateName").textContent = T["coll_name_"+c.key][LANG];
  document.getElementById("plateLatin").textContent = c.latin;
  buildPlateTabs();
}

function resetPlateTimer(){
  if(plateTimer) clearInterval(plateTimer);
  plateTimer = setInterval(()=>{
    plateIdx = (plateIdx+1) % COLLECTIONS.length;
    updatePlate();
  }, 4500);
}

/* reveal on scroll */
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add("in"); });
}, {threshold:.12});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));

/* nav + lang */
document.getElementById("langsw").addEventListener("click",(e)=>{
  const btn = e.target.closest("button");
  if(!btn) return;
  applyLang(btn.dataset.lang);
});
document.getElementById("burgerBtn").addEventListener("click", ()=>{
  document.getElementById("mobnav").classList.toggle("open");
});
document.querySelectorAll(".mobnav a").forEach(a=>a.addEventListener("click", ()=>{
  document.getElementById("mobnav").classList.remove("open");
}));

/* order form (demo only) */
document.getElementById("orderForm").addEventListener("submit",(e)=>{
  e.preventDefault();
  const toast = document.getElementById("orderToast");
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"), 7000);
});

/* init */
applyLang("ru");
resetPlateTimer();
</script>
</body>
</html>
